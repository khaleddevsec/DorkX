name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Test (${{ matrix.os }}, Go ${{ matrix.go-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        go-version: [ '1.21', '1.22', '1.23' ]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Verify Formatting (Linux)
        if: runner.os == 'Linux'
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Unformatted files found:"
            gofmt -l .
            exit 1
          fi

      - name: Run Go Vet
        run: go vet ./...

      - name: Run Tests
        run: go test -v ./...

      - name: Run Race Detector (Linux)
        if: runner.os == 'Linux'
        run: go test -race -v ./...

      - name: Build Binary
        run: go build -v .

      - name: Cross-Compile macOS Binaries (Linux)
        if: runner.os == 'Linux'
        run: |
          GOOS=darwin GOARCH=amd64 go build -v -o dist/dorkx_darwin_amd64 .
          GOOS=darwin GOARCH=arm64 go build -v -o dist/dorkx_darwin_arm64 .

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build Multi-Platform Releases
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Build Binaries
        run: |
          mkdir -p dist
          # Linux AMD64 & ARM64
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/dorkx_linux_amd64 .
          GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o dist/dorkx_linux_arm64 .

          # Windows AMD64 & ARM64
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o dist/dorkx_windows_amd64.exe .
          GOOS=windows GOARCH=arm64 go build -ldflags="-s -w" -o dist/dorkx_windows_arm64.exe .

          # macOS (Darwin) AMD64 & ARM64 (Apple Silicon)
          GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o dist/dorkx_darwin_amd64 .
          GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o dist/dorkx_darwin_arm64 .

          # Generate SHA256 checksums
          cd dist
          sha256sum * > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
